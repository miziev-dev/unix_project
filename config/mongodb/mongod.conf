# @file mongod.conf
# @brief Конфигурация MongoDB для production окружения
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

storage:
  dbPath: /data/db
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.0 # Ограничение памяти СУБД (защита от OOM killer хоста)

net:
  port: 27017
  bindIpAll: true

security:
  authorization: enabled
  keyFile: /opt/keyfile/replica.key

replication:
  replSetName: "rs0"
